<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fieber Tracker">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Fieber Tracker">
<meta name="description" content="Professionelle Fieberdaten-Erfassung für Kinder">
<title>Fieber Tracker</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" media="print" href="./print.css">
</head>
<body>

<header>
  <div class="hdr">
    <div class="logo-icon">🌡️</div>
    <div class="logo">
      <h1>Fieber Tracker</h1>
      <p>Temperatur · Medikamente · Verlauf</p>
    </div>
  </div>
</header>

<main>

  <!-- KINDER DROPDOWN -->
  <div class="child-selector" id="childSelector">
    <button class="child-trigger empty" id="childTrigger" onclick="toggleChildDropdown()">
      <div class="child-trigger-avatar" id="triggerAvatar">👶</div>
      <div class="child-trigger-text">
        <div class="child-trigger-name" id="triggerName">Kind auswählen</div>
        <div class="child-trigger-meta" id="triggerMeta">Tippen zum Öffnen</div>
      </div>
      <span class="child-trigger-chevron">▾</span>
    </button>
    <div class="child-dropdown" id="childDropdown"></div>
  </div>

  <!-- CHILD CONTENT -->
  <div id="childContent" style="display:none">

    <div class="vtabs">
      <button class="vtab active" onclick="switchView('eingabe',this)">📝 Erfassung</button>
      <button class="vtab" onclick="switchView('verlauf',this)">📋 Verlauf</button>
    </div>

    <!-- EINGABE -->
    <div class="panel active" id="panel-eingabe">

      <div class="card">
        <div class="card-hdr"><div class="chicon">🌡️</div><h2>Messung</h2></div>
        <div class="cbody">
          <div class="fg2">
            <div class="fg">
              <label>Temperatur</label>
              <div class="tw">
                <input type="number" id="i-temp" min="34" max="42.5" step="0.1" placeholder="36,0" autocomplete="off" oninput="onTempInput()">
                <span class="tu">°C</span>
              </div>
              <div id="tprev" style="min-height:20px;margin-top:1px"></div>
            </div>
            <div class="fg">
              <label>Uhrzeit</label>
              <input type="time" id="i-time">
            </div>
            <div class="fg">
              <label>Datum</label>
              <input type="date" id="i-date">
            </div>
            <div class="fg">
              <label>Messort</label>
              <div class="sw"><select id="i-site">
                <option>Rektal</option>
                <option>Axillar (Achsel)</option>
                <option>Oral</option>
                <option>Ohr</option>
                <option>Stirn</option>
              </select></div>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-hdr"><div class="chicon">💊</div><h2>Fiebermittel</h2></div>
        <div class="cbody">
          <div class="fg3">
            <div class="fg">
              <label>Mittel</label>
              <div class="sw"><select id="i-med" onchange="onMedChange()">
                <option value="Keines">Keines</option>
                <option value="Zäpfchen">Zäpfchen</option>
                <option value="Saft">Saft</option>
              </select></div>
            </div>
            <div class="fg">
              <label>Menge</label>
              <div class="sw"><select id="i-dose" disabled><option value="—">—</option></select></div>
            </div>
            <div class="fg">
              <label>Wirkstoff</label>
              <div class="sw"><select id="i-active" disabled><option value="—">—</option></select></div>
            </div>
          </div>
          <div class="fg2" id="i-wirk-row" style="display:none">
            <div class="fg">
              <label>Wirkzeit Zäpfchen</label>
              <div class="sw"><select id="i-wirk" onchange="saveWirkDefault()">
                <option value="6">6 Stunden</option>
                <option value="7">7 Stunden</option>
                <option value="8" selected>8 Stunden</option>
              </select></div>
            </div>
          </div>
          <div id="med-note" style="font-size:12px;color:var(--muted);padding-top:9px;min-height:18px;letter-spacing:.1px"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-hdr"><div class="chicon">📝</div><h2>Notiz (optional)</h2></div>
        <div class="cbody">
          <div class="fg">
            <textarea id="i-note" placeholder="Symptome, Befinden, Beobachtungen…" rows="3"
              style="width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-sm);padding:10px 12px;outline:none;resize:vertical;transition:all .2s;color-scheme:dark"
              onfocus="this.style.borderColor='rgba(255,255,255,.55)';this.style.background='rgba(255,255,255,.11)'"
              onblur="this.style.borderColor='var(--input-border)';this.style.background='var(--input-bg)'"></textarea>
          </div>
          <button class="btn-save" onclick="saveEntry()">➕ Eintrag speichern</button>
        </div>
      </div>

    </div>

    <!-- VERLAUF -->
    <div class="panel" id="panel-verlauf">

      <!-- Wirkzeit Banner -->
      <div id="med-banner" style="display:none"></div>

      <div class="card" style="padding:10px 14px;margin-bottom:12px">
        <div style="display:flex;align-items:center;gap:10px">
          <label style="white-space:nowrap;margin:0">Zeitraum</label>
          <div class="sw" style="flex:1"><select id="i-range" onchange="renderVerlauf()">
            <option value="all" selected>Gesamter Verlauf</option>
            <option value="24">Letzte 24 Stunden</option>
            <option value="48">Letzte 48 Stunden</option>
            <option value="168">Letzte 7 Tage</option>
            <option value="720">Letzte 30 Tage</option>
          </select></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat"><b id="s-count">0</b><small>Messungen</small></div>
        <div class="stat"><b id="s-max">—</b><small>Höchst °C</small></div>
        <div class="stat"><b id="s-avg">—</b><small>Ø Temp °C</small></div>
      </div>

      <!-- Temperaturgraph -->
      <div class="card" id="chart-card">
        <div class="chart-wrap">
          <div class="chart-title">Temperaturverlauf</div>
          <div id="chart-container"></div>
        </div>
      </div>

      <div class="card">
        <div class="list-tb">
          <span id="lcount">0 Einträge</span>
          <div class="tbr">
            <button class="bsec bghost" onclick="clearChild()">🗑 Leeren</button>
            <button class="bsec bdark" onclick="exportPDF()">📄 PDF Export</button>
          </div>
        </div>
        <div id="elist"></div>
      </div>
    </div>

  </div><!-- /childContent -->

</main>

<!-- EDIT ENTRY MODAL -->
<div class="mbg" id="modal-edit">
  <div class="modal" style="max-width:400px">
    <h3>Eintrag bearbeiten</h3>
    <div class="modal-edit-inner">
      <div class="modal-section-title">Messung</div>
      <div class="edit-fg2" style="margin-bottom:10px">
        <div class="edit-fg">
          <label>Temperatur</label>
          <div class="edit-tw">
            <input type="number" id="e-temp" min="34" max="42.5" step="0.1" placeholder="36,0">
            <span class="edit-tu">°C</span>
          </div>
        </div>
        <div class="edit-fg">
          <label>Uhrzeit</label>
          <input type="time" id="e-time">
        </div>
      </div>
      <div class="edit-fg2" style="margin-bottom:4px">
        <div class="edit-fg">
          <label>Datum</label>
          <input type="date" id="e-date">
        </div>
        <div class="edit-fg">
          <label>Messort</label>
          <div class="edit-sw"><select id="e-site">
            <option>Rektal</option>
            <option>Axillar (Achsel)</option>
            <option>Oral</option>
            <option>Ohr</option>
            <option>Stirn</option>
          </select></div>
        </div>
      </div>
      <div class="modal-section-title">Fiebermittel</div>
      <div class="edit-fg3" style="margin-bottom:4px">
        <div class="edit-fg">
          <label>Mittel</label>
          <div class="edit-sw"><select id="e-med" onchange="onEditMedChange()">
            <option value="Keines">Keines</option>
            <option value="Zäpfchen">Zäpfchen</option>
            <option value="Saft">Saft</option>
          </select></div>
        </div>
        <div class="edit-fg">
          <label>Menge</label>
          <div class="edit-sw"><select id="e-dose" disabled><option value="—">—</option></select></div>
        </div>
        <div class="edit-fg">
          <label>Wirkstoff</label>
          <div class="edit-sw"><select id="e-active" disabled><option value="—">—</option></select></div>
        </div>
      </div>
      <div class="edit-fg" style="margin-top:10px" id="e-wirk-row">
        <label>Wirkzeit Zäpfchen</label>
        <div class="edit-sw"><select id="e-wirk">
          <option value="6">6 Stunden</option>
          <option value="7">7 Stunden</option>
          <option value="8">8 Stunden</option>
        </select></div>
      </div>
      <div class="modal-section-title">Notiz</div>
      <div class="edit-fg" style="margin-bottom:4px">
        <textarea id="e-note" rows="2" placeholder="Symptome, Befinden…"
          style="width:100%;font-family:inherit;font-size:16px;color:var(--text);background:var(--input-bg);border:1px solid var(--input-border);border-radius:var(--radius-xs);padding:9px 11px;outline:none;resize:none;color-scheme:dark"></textarea>
      </div>
      <button class="btn-update" onclick="saveEdit()">✓ Änderungen speichern</button>
    </div>
    <div class="mbtns" style="margin-top:10px">
      <button class="mbtn no" onclick="closeEditModal()">Abbrechen</button>
    </div>
  </div>
</div>

<!-- Kinder sind fest im Code hinterlegt -->

<div class="toast" id="toast"></div>

<!-- PRINT PAGE - only visible when printing / Als PDF speichern -->
<div id="print-page" style="display:none"></div>

<script src="./app.js"></script>
</body>
</html>
